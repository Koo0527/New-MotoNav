name: Build Android APK (countdown + standard)
on:
  workflow_dispatch:
  push:
    branches: [main, ci/new-motonav-android-cover]
    paths: [android/**, .github/workflows/android-build.yml]
permissions:
  contents: write

jobs:
  countdown:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build countdown debug APK
        working-directory: android/countdown
        run: gradle --no-daemon assembleDebug
      - name: Upload countdown APK
        uses: actions/upload-artifact@v4
        with:
          name: countdown-debug
          path: android/countdown/app/build/outputs/apk/debug/*.apk

  standard:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build standard debug APK
        working-directory: android/standard
        run: gradle --no-daemon assembleDebug
      - name: Upload standard APK
        uses: actions/upload-artifact@v4
        with:
          name: standard-debug
          path: android/standard/app/build/outputs/apk/debug/*.apk
