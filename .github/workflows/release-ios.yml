name: Build and publish iOS
on:
  push:
    branches: [main]
    paths: [RELEASE_VERSION, .github/workflows/release-ios.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: motonav-public-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify iOS search, ride persistence and phone clock
        run: |
          python3 ios/tests/ios-fixes/check.py
          python3 ios/tests/unified-planner/check.py
          python3 ios/tests/tunnel-settings/check.py
          python3 ios/tests/tunnel-sdk/check.py
          swiftc ios/MotoNav/TunnelDimming.swift ios/tests/tunnel-dimming/main.swift -o /tmp/tunnel-dimming
          /tmp/tunnel-dimming
          swiftc ios/MotoNav/BleHandshakeClock.swift ios/tests/phone-clock/main.swift -o /tmp/phone-clock
          /tmp/phone-clock
      - name: Verify arrival lifecycle and callback sessions
        run: |
          swiftc ios/MotoNav/ArrivalPolicy.swift ios/tests/arrival/main.swift -o /tmp/arrival
          /tmp/arrival
          swiftc ios/MotoNav/ArrivalPolicy.swift ios/MotoNav/NaviSessionCallbacks.swift ios/tests/arrival-relay/SDKStubs.swift ios/tests/arrival-relay/main.swift -o /tmp/arrival-relay
          /tmp/arrival-relay
      - name: Install locked iOS dependencies
        working-directory: ios
        run: |
          sudo gem install cocoapods -v 1.16.2 --no-document
          pod _1.16.2_ install --deployment
      - name: Build unsigned iPhone IPA
        run: ./scripts/build-ios-ipa.sh
      - name: Verify iOS data and BLE behavior
        run: |
          python3 ios/tests/webmotor/check.py
          swiftc -O ios/MotoNav/MapGeo.swift ios/MotoNav/RasterProcessing.swift ios/MotoNav/RouteMapPlan.swift ios/tests/maps/main.swift -o /tmp/maps
          /tmp/maps
          swiftc ios/MotoNav/BleBulkWriteQueue.swift ios/MotoNav/BleWritePacer.swift ios/tests/ble-bulk/main.swift -o /tmp/bulk
          /tmp/bulk
          swiftc ios/MotoNav/BleWritePacer.swift ios/tests/ble-pacing/main.swift -o /tmp/pacing
          /tmp/pacing
      - name: Package iOS source and instructions
        shell: bash
        run: |
          VERSION=$(cat RELEASE_VERSION)
          test -f "output/ios/MotoNav-${VERSION}-unsigned.ipa"
          git archive --format=zip --prefix=MotoNav/ HEAD > "output/ios/MotoNav-${VERSION}-source.zip"
          cp docs/INSTALL-IOS.md output/ios/INSTALL-IOS.md
          cp "docs/RELEASE-IOS-${VERSION}.md" output/ios/RELEASE-NOTES.md
          cd output/ios
          shasum -a 256 *.ipa *.zip *.md > SHA256SUMS.txt
      - name: Keep build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: motonav-public-release
          path: output/ios/
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION=$(cat RELEASE_VERSION)
          TAG="ios-v${VERSION}"
          gh release create "$TAG" --target "$GITHUB_SHA" --title "MotoNav iOS ${VERSION}" --notes-file "docs/RELEASE-IOS-${VERSION}.md" --draft
          gh release upload "$TAG" output/ios/*.ipa output/ios/*.zip output/ios/*.md output/ios/SHA256SUMS.txt
          gh release edit "$TAG" --draft=false
